spring.application.name=billing-service

server.port=${SERVER_PORT:4001}
grpc.server.port=9001
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:billingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
billing.internal-service-token=${BILLING_INTERNAL_SERVICE_TOKEN:}
billing.payment-provider=${BILLING_PAYMENT_PROVIDER:none}
